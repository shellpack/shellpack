name: release

# Build the distribution on a version tag and publish it to PyPI.
#
# Publishing uses PyPI trusted publishing: the job presents its OIDC
# token and PyPI checks it against the publisher registered for the
# project (owner shellpack, repository shellpack, this workflow, the
# 'pypi' environment). No API token exists anywhere. The build and the
# publish are separate jobs so that the one holding the publish
# permission runs nothing but the publish action.
#
# The tag must match the version in pyproject.toml; the check below
# refuses a tag that does not, before anything is built.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check the tag against pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match version ${version}" >&2
            exit 1
          fi

      - run: uv build
      - run: ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shellpack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
